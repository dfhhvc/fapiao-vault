<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="FapiaoVault logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="10" y="10" width="220" height="220" rx="48" fill="url(#bg)"/>

  <!-- 发票纸张 -->
  <g>
    <rect x="58" y="42" width="118" height="148" rx="10" fill="url(#paper)" stroke="#C7D2FE" stroke-width="2"/>
    <!-- 票头横线 -->
    <rect x="74" y="60" width="86" height="9" rx="4.5" fill="#1E3A8A"/>
    <!-- 字段行 -->
    <rect x="74" y="82" width="60" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="74" y="97" width="74" height="6" rx="3" fill="#CBD5E1"/>
    <!-- 红色发票专用章（半透明，压在字段行上） -->
    <circle cx="146" cy="106" r="23" fill="none" stroke="#DC2626" stroke-width="5" opacity="0.75"/>
    <text x="146" y="110" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#DC2626" opacity="0.85">发票专用</text>
    <!-- 金额（先画线再画金额，保证数字在最上层、绝对清晰） -->
    <rect x="74" y="160" width="42" height="5" rx="2.5" fill="#CBD5E1"/>
    <text x="72" y="150" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" fill="#0F172A">&#165;544.60</text>
    <!-- 撕票线（发票底缘锯齿） -->
    <g fill="#C7D2FE">
      <circle cx="70" cy="190" r="4"/><circle cx="86" cy="190" r="4"/><circle cx="102" cy="190" r="4"/>
      <circle cx="118" cy="190" r="4"/><circle cx="134" cy="190" r="4"/><circle cx="150" cy="190" r="4"/>
      <circle cx="166" cy="190" r="4"/>
    </g>
  </g>

  <!-- 校验通过徽章（右下角，与金额垂直错开） -->
  <circle cx="184" cy="184" r="30" fill="#10B981" stroke="#0F172A" stroke-width="7"/>
  <path d="M170 184 L180 194 L199 172" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
