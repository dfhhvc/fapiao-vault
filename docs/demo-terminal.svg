<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" width="840" height="560" role="img" aria-label="fapiao scan 终端演示">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2128"/>
      <stop offset="1" stop-color="#151A21"/>
    </linearGradient>
  </defs>

  <!-- 窗口阴影与主体 -->
  <rect x="8" y="8" width="824" height="544" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- 标题栏 -->
  <rect x="8" y="8" width="824" height="40" rx="12" fill="url(#titlebar)"/>
  <rect x="8" y="36" width="824" height="12" fill="url(#titlebar)"/>
  <circle cx="36" cy="28" r="7" fill="#FF5F57"/>
  <circle cx="60" cy="28" r="7" fill="#FEBC2E"/>
  <circle cx="84" cy="28" r="7" fill="#28C840"/>
  <text x="420" y="33" text-anchor="middle" font-family="Consolas, 'Microsoft YaHei', monospace" font-size="14" fill="#8B949E">PowerShell — fapiao scan</text>

  <!-- 终端内容 -->
  <g font-family="Consolas, 'Microsoft YaHei', monospace" font-size="14">

    <!-- 命令行 -->
    <text x="32" y="82" fill="#3FB950">PS C:\发票&gt;</text>
    <text x="146" y="82" fill="#E6EDF3" font-weight="bold">fapiao scan ./samples --archive</text>

    <!-- 扫描头 -->
    <text x="32" y="118" fill="#E6EDF3" font-weight="bold">FapiaoVault 发票扫描</text>
    <text x="32" y="142" fill="#8B949E">  目录：C:\发票\samples&#160;&#160;&#160;&#160;递归：是</text>
    <text x="32" y="166" fill="#484F58">──────────────────────────────────────────────────────</text>

    <!-- 统计区（标签 + 数值两列） -->
    <text x="52" y="190" fill="#8B949E">扫描文件</text>        <text x="230" y="190" fill="#E6EDF3">7 个</text>
    <text x="52" y="214" fill="#8B949E">识别成功</text>        <text x="230" y="214" fill="#3FB950" font-weight="bold">5 张</text>
    <text x="52" y="238" fill="#8B949E">未识别</text>          <text x="230" y="238" fill="#D29922">2 个</text>
    <text x="52" y="262" fill="#8B949E">价税合计</text>        <text x="230" y="262" fill="#E6EDF3" font-weight="bold">&#165;544.60</text>
    <text x="52" y="286" fill="#8B949E">税额合计</text>        <text x="230" y="286" fill="#E6EDF3">&#165;24.60</text>
    <text x="52" y="310" fill="#8B949E">重复发票</text>        <text x="230" y="310" fill="#F85149" font-weight="bold">1 组</text>

    <!-- 批内重复 -->
    <text x="32" y="346" fill="#E6EDF3" font-weight="bold">重复发票明细</text>
    <text x="32" y="370" fill="#D29922">  [提示] 25117000000000000001&#160;&#160;同一张发票出现多次</text>
    <text x="64" y="394" fill="#8B949E">- 01_数电票_出租车_42.50元.pdf</text>
    <text x="64" y="418" fill="#8B949E">- 04_重复下载_同一张票.pdf</text>

    <!-- 跨期重复（杀手功能） -->
    <text x="32" y="454" fill="#F85149" font-weight="bold">与历史台账重号（跨期，疑似重复报销）</text>
    <text x="32" y="478" fill="#F85149">  ! 25117000000000000001&#160;&#160;台账月份 2026-08 / 本次 2026-09</text>
    <text x="64" y="502" fill="#8B949E">- 01_数电票_出租车_42.50元.pdf</text>

    <!-- 收尾 -->
    <text x="32" y="534" fill="#3FB950">已生成报表（HTML / Excel / CSV / JSON），自动按月归档完成</text>
  </g>
</svg>
